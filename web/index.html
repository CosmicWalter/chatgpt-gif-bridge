<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIF Bridge</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<aside><a class="brand" href="/">◈ <span>GIF Bridge</span></a><p class="eyebrow">工作台</p><nav><a class="selected" href="#create">生成任务</a><a href="#jobs">任务记录</a></nav><div class="aside-bottom"><span id="connection" class="connection">尚未连接</span><button id="disconnect" class="quiet" hidden>断开连接</button><a href="https://github.com/CosmicWalter/chatgpt-gif-bridge" target="_blank" rel="noreferrer">GitHub ↗</a></div></aside>
<main><header><div><h1>GIF 管理</h1><p>通过 ChatGPT 网页生成原生 GIF</p></div><span class="local-tag">无头浏览器</span></header>
<section id="login" class="panel login"><h2>连接本地服务</h2><p>粘贴启动目录下 <code>.state/api-token</code> 文件中的访问密钥。</p><form id="login-form"><label for="token">访问密钥</label><div class="input-row"><input id="token" type="password" autocomplete="off" required placeholder="输入本地访问密钥"><button type="submit">连接</button></div></form><p class="note">密钥只保存在当前标签页，断开连接后清除。</p></section>
<div id="workspace" hidden>
<section class="panel account"><div class="section-heading"><h2>ChatGPT 账号</h2><span id="account-status" class="status">检查中</span></div><p id="account-help" class="note">请使用支持 GIF 的 Plus 账号。</p><div class="job-actions"><button id="account-login" type="button" class="secondary">登录 ChatGPT</button><button id="account-finish" type="button" hidden>已完成登录</button></div></section>
<section id="create" class="panel"><div class="section-heading"><h2>生成 GIF</h2></div><form id="create-form"><label for="prompt">提示词</label><textarea id="prompt" maxlength="8000" rows="4" required placeholder="描述画面、动作和循环方式"></textarea><div class="form-bottom"><span class="note">自动提交、等待生成并下载 GIF。</span><button id="submit-job" type="submit" disabled>生成</button></div></form></section>
<section class="records" id="jobs"><div class="section-heading"><div><h2>任务记录 <span id="job-count" class="count">0</span></h2><p class="note">最多保留 8 条，重启服务后清空。</p></div><button id="refresh" class="secondary">刷新</button></div><div id="job-list"></div><div id="empty" class="panel empty"><p>暂无任务</p></div></section>
</div><p id="message" role="status" aria-live="polite"></p>
</main><template id="job-template"><article class="panel job"><div class="job-header"><span class="job-mode"></span><span class="status"></span></div><p class="job-prompt"></p><p class="job-error" role="alert" hidden></p><img class="preview" alt="GIF 预览" hidden><div class="job-actions"></div></article></template>
</body></html>
