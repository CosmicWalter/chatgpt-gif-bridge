<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIF Bridge</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<aside><a class="brand" href="/">◈ <span>GIF Bridge</span></a><p class="eyebrow">工作台</p><nav><a class="selected" href="#create">创作任务</a><a href="#jobs">任务记录</a></nav><div class="aside-bottom"><span id="connection" class="connection">尚未连接</span><button id="disconnect" class="quiet" hidden>断开连接</button><a href="https://github.com/CosmicWalter/chatgpt-gif-bridge" target="_blank" rel="noreferrer">GitHub ↗</a></div></aside>
<main><header><div><span class="eyebrow">NATIVE GIF WORKSPACE</span><h1>让想法动起来。</h1><p>创建、导入和管理你的原生 GIF。</p></div><span class="local-tag">本地运行</span></header>
<section id="login" class="panel login"><h2>连接本地服务</h2><p>粘贴启动目录下 <code>.state/api-token</code> 文件中的访问密钥。</p><form id="login-form"><label for="token">访问密钥</label><div class="input-row"><input id="token" type="password" autocomplete="off" required placeholder="输入本地访问密钥"><button type="submit">连接</button></div></form><p class="note">密钥只保存在当前标签页，断开连接后清除。</p></section>
<div id="workspace" hidden>
<section id="create" class="panel"><div class="section-heading"><h2>新建创作</h2><span class="muted">GIF</span></div><form id="create-form"><label for="backend">生成方式</label><div class="mode-grid"><label class="mode"><input type="radio" name="backend" value="web" checked><span><strong>ChatGPT 网页</strong><small>打开网页生成，下载后上传完成任务</small></span></label><label class="mode"><input id="api-option" type="radio" name="backend" value="api"><span><strong>官方 API</strong><small id="api-note">检查配置中</small></span></label></div><label for="prompt">画面与动作</label><textarea id="prompt" maxlength="8000" rows="4" required placeholder="一只纸船在蓝色水面轻轻起伏，无缝循环，固定镜头……"></textarea><div class="form-bottom"><span id="mode-hint" class="note">网页模式需要你在 ChatGPT 中提交提示词、下载并上传 GIF。</span><button id="submit-job" type="submit">创建任务 <span aria-hidden="true">↗</span></button></div></form></section>
<section class="records" id="jobs"><div class="section-heading"><div><h2>任务记录 <span id="job-count" class="count">0</span></h2><p class="note">最多保留 8 条，重启服务后清空。</p></div><button id="refresh" class="secondary">刷新</button></div><div id="job-list"></div><div id="empty" class="panel empty"><span class="empty-icon">◇</span><h3>你的第一段动画，从这里开始</h3><p>描述一个画面和动作，创建 GIF 任务。</p></div></section>
</div><p id="message" role="status" aria-live="polite"></p>
</main><template id="job-template"><article class="panel job"><div class="job-header"><span class="job-mode"></span><span class="status"></span></div><p class="job-prompt"></p><p class="job-error" role="alert" hidden></p><img class="preview" alt="生成的 GIF 动画预览" hidden><div class="job-actions"></div></article></template>
</body></html>
